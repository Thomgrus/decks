<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SFEIR — Presentations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root { --primary:#282A7A; --primary-2:#1a9e96; --gold:#b8924a; --text:#1E293B; --text-2:#64748B; --bg:#F7FAFB; --card:#FFF; --border:#E2E8F0; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',-apple-system,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:48px 24px; }
.badge { display:inline-block; padding:8px 20px; border:2px solid var(--primary); border-radius:30px; font-family:'Montserrat'; font-weight:600; font-size:12px; letter-spacing:2px; text-transform:uppercase; color:var(--primary); margin-bottom:24px; }
h1 { font-family:'Montserrat'; font-weight:900; font-size:48px; letter-spacing:-1px; margin-bottom:8px; text-align:center; }
h1 span { background:linear-gradient(135deg,var(--primary),var(--primary-2)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.subtitle { font-size:18px; color:var(--text-2); margin-bottom:48px; }
.cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:24px; max-width:840px; width:100%; }
.card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:32px; text-decoration:none; color:inherit; transition:transform .2s, box-shadow .2s; box-shadow:0 1px 3px rgba(0,0,0,.04); position:relative; overflow:hidden; }
.card .bar { position:absolute; top:0; left:0; width:100%; height:4px; background:linear-gradient(90deg,var(--c1),var(--c2)); }
.card:hover { transform:translateY(-4px); box-shadow:0 14px 34px rgba(0,0,0,.10); }
.tags { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
.tags .t { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:1px; padding:4px 10px; border-radius:20px; background:color-mix(in srgb, var(--c1) 10%, transparent); color:var(--c1); }
.card h2 { font-family:'Montserrat'; font-weight:700; font-size:22px; margin-bottom:8px; }
.card p { font-size:14px; color:var(--text-2); line-height:1.6; margin-bottom:16px; min-height:44px; }
.meta { font-size:12px; color:#94A3B8; }
.arrow { position:absolute; bottom:26px; right:28px; font-size:20px; color:var(--border); transition:color .2s, transform .2s; }
.card:hover .arrow { color:var(--c1); transform:translateX(4px); }
footer { margin-top:48px; font-size:12px; color:#94A3B8; }
</style>
</head>
<body>
<div class="badge">SFEIR</div>
<h1>Mes <span>présentations</span></h1>
<p class="subtitle">Talks &amp; decks — version partagée</p>
<div class="cards">
    <a href="commerce-agentique/" class="card" style="--c1:#282A7A;--c2:#1a9e96">
      <div class="bar"></div>
      <div class="tags"><span class="t">GenAI</span><span class="t">MCP</span><span class="t">UCP</span></div>
      <h2>Commerce agentique</h2>
      <p>Quand votre IA passe à la caisse</p>
      <div class="meta">17 juin 2026</div>
      <div class="arrow">→</div>
    </a>
    <a href="presentation-perso/" class="card" style="--c1:#282A7A;--c2:#1a9e96">
      <div class="bar"></div>
      <div class="tags"><span class="t">CloudOps</span><span class="t">GenAI</span><span class="t">Platform</span></div>
      <h2>Thomas Gruson</h2>
      <p>CloudOps / IA Engineer — de la plateforme cloud aux agents IA</p>
      <div class="meta">Juin 2026</div>
      <div class="arrow">→</div>
    </a>
</div>
<footer>SFEIR — 2026</footer>
</body>
</html>
